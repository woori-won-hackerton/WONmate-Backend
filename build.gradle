plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'wonit.hackathon'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// Spring AI: BOM = "이 버전들끼리는 서로 맞는다" 는 버전 목록표 (아래 스타터에는 버전을 따로 적지 않는다)
dependencyManagement {
	imports {
		mavenBom 'org.springframework.ai:spring-ai-bom:2.0.1'
	}
}

dependencies {
	implementation 'org.apache.pdfbox:pdfbox:3.0.8'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	// Source: https://mvnrepository.com/artifact/org.postgresql/postgresql
	implementation("org.postgresql:postgresql:42.7.14")
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	implementation 'org.hibernate.orm:hibernate-vector'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('ragDebug', JavaExec) {
	group = 'application'
	description = 'Extract and chunk PDFs without starting Spring, a database, or OpenAI (default: product_01; --args="--all" for all).'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'wonit.hackathon.a1.rag.RagDebug'
	maxHeapSize = '2g'
}

tasks.register('ragIngest', JavaExec) {
	group = 'application'
	description = 'Register missing products from local metadata and embed/ingest PDFs into the configured database.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'wonit.hackathon.a1.rag.RagIngest'
	maxHeapSize = '2g'
}
