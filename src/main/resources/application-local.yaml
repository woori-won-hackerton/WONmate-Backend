rag:
  embedding:
    # 최초 요청 실패 후 429/5xx에만 retries회 추가 시도한다. API 키는 설정에 직접 쓰지 않는다.
    batch-size: 16
    timeout-seconds: 60
    retries: 3
  debug:
    # 적재 API와 독립 PDF 디버그 CLI가 함께 사용하는 원본 문서 루트다.
    documents: documents
    output: build/rag-debug
  chunking:
    # Local estimate, not an embedding-model tokenizer. Short articles stay intact.
    target-tokens: 750
    max-tokens: 1000
    overlap-tokens: 80
    chars-per-token: 1.5

spring:
  config:
    # 프로젝트 루트에서 실행할 때 로컬 .env를 읽는다. 시스템 환경 변수가 우선한다.
    import: optional:file:.env[.properties]
  datasource:
    url: ${WONMATE_DB_URL}
    username: ${WONMATE_DB_USERNAME}
    password: ${WONMATE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # 구축된 스키마만 검증하며 시작 시 테이블 생성이나 변경을 수행하지 않는다.
      ddl-auto: create
    show-sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    generate-ddl: false
  sql:
    init:
      # db/rag의 SQL은 필요한 대상 DB에 명시적으로 실행한다.
      mode: never
      platform: postgres
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}              # 🚨 키는 환경변수에서만 읽는다
      chat:
        model: ${AI_MODEL:gpt-6-luna}  # 수업 당일 사이트에서 저렴한 모델 이름 확인
      embedding:
        dimensions: 1536
        model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
server:
  port: 8081
