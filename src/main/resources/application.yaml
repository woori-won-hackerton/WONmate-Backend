
server:
  port: 8081
spring:
  config:
    import: optional:file:.env[.properties]
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  application:
    name: a1
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-6-luna}


jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-seconds: 1800
  issuer: cgv-api

app:
  briefing:
    model: ${OPENAI_CHAT_MODEL:gpt-6-luna}